version: '3.8'

services:
  # Primary MongoDB Datastore
  mongodb:
    image: mongo:7.0
    container_name: academic_assistant_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: academic_assistant
    volumes:
      - mongo_data:/data/db
    networks:
      - internal_mesh

  # Redis Task Broker & Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: academic_assistant_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - internal_mesh

  # ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:0.5.4
    container_name: academic_assistant_chromadb
    restart: unless-stopped
    ports:
      - '8001:8000'
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    networks:
      - internal_mesh

  # Python FastAPI AI Microservice
  ai-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.ai
    container_name: academic_assistant_ai
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - chromadb
      - redis
    networks:
      - internal_mesh

  # Node.js Express API Gateway (BFF)
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    container_name: academic_assistant_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/academic_assistant
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTERNAL_FASTAPI_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - redis
      - ai-service
    networks:
      - internal_mesh

  # React SPA Client
  frontend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: academic_assistant_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - backend
    networks:
      - internal_mesh

networks:
  internal_mesh:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  chroma_data:
