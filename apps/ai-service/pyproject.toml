[tool.poetry]
name = "ai-service"
version = "0.1.0"
description = "FastAPI and LangGraph microservice for AI Academic Assistant"
authors = ["Academic AI Engineering Team <dev@institution.edu>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.112.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
pydantic = ">=2.7.0"
langgraph = ">=0.2.0"
langchain-core = ">=0.2.0"
sentence-transformers = ">=3.0.0"
torch = ">=2.2.0"
chromadb = ">=0.5.4"
qdrant-client = ">=1.10.0"
tiktoken = ">=0.7.0"
redis = ">=5.0.0"
pdfplumber = ">=0.11.0"
pypdf = ">=4.2.0"
pymupdf = ">=1.24.0"
python-docx = ">=1.1.0"
motor = ">=3.5.0"
python-multipart = ">=0.0.9"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.5.0"
black = ">=24.4.0"
mypy = ">=1.10.0"
pytest = ">=8.2.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
