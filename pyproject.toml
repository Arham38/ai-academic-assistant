[tool.poetry]
name = "ai-academic-assistant"
version = "0.1.0"
description = "Enterprise AI Academic Assistant for semantic plagiarism detection, citation validation, and agentic RAG"
authors = ["Academic AI Engineering Team <dev@institution.edu>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.112.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
langgraph = ">=0.2.0"
langchain-core = ">=0.2.0"
pydantic = ">=2.7.0"
sentence-transformers = ">=3.0.0"
torch = ">=2.2.0"
chromadb = ">=0.5.4"
redis = ">=5.0.0"
pdfplumber = ">=0.11.0"
pypdf = ">=4.2.0"
python-multipart = ">=0.0.9"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.5.0"
black = ">=24.4.0"
mypy = ">=1.10.0"
pytest = ">=8.2.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# --- Ruff Linter Configuration ---
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line length is handled by the formatter
    "B008", # Do not perform function call in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["ai_service"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# --- Black Formatter Configuration ---
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

# --- Mypy Static Type Checking Configuration ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
