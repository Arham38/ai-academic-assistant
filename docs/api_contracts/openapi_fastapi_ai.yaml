openapi: 3.1.0
info:
  title: AI Academic Assistant - Internal AI Microservice
  description: Internal service mesh API exposed by Python FastAPI for heavy compute, LangGraph orchestration, and vector indexing.
  version: 1.0.0
servers:
  - url: http://fastapi-ai:8000/internal/v1
    description: Internal VPC Docker Service Bridge

security:
  - InternalApiKey: []

paths:
  /process-document:
    post:
      summary: Execute asynchronous background document extraction, embedding, and agentic analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, tenantId, userId, fileStorageUri]
              properties:
                documentId: { type: string }
                tenantId: { type: string }
                userId: { type: string }
                fileStorageUri: { type: string }
                jobId: { type: string }
      responses:
        '202':
          description: Processing initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  status: { type: string, example: "PROCESSING" }

  /agent/query:
    post:
      summary: Synchronous or streaming conversational agent query against indexed vectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, tenantId, prompt]
              properties:
                documentId: { type: string }
                tenantId: { type: string }
                prompt: { type: string }
                temperature: { type: number, default: 0.2 }
                maxIterations: { type: integer, default: 3 }
      responses:
        '200':
          description: Agent tokens stream (SSE)
          content:
            text/event-stream:
              schema:
                type: string

  /vectors/documents/{documentId}:
    delete:
      summary: Cascade delete all vector embeddings and chunks associated with a document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vectors purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedChunksCount: { type: integer }

components:
  securitySchemes:
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
